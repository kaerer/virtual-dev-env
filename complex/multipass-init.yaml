#cloud-config
# Multipass Virtual Machine Automatic Startup Configuration (Cloud-Init)
users:
    - default
    - name: developer
      sudo: ALL=(ALL) NOPASSWD:ALL
      shell: /bin/bash

package_update: true
package_upgrade: false

# Common and stable Linux base packages
packages:
  - build-essential
  - software-properties-common
  - git
  - unzip
#  - curl
#  - htop
#  - wget
#  - sqlite3
  - redis-server
#  - postgresql
#  - postgresql-contrib

runcmd:
  # 1. Setup project workspace directory structure and permissions
  - mkdir -p /home/ubuntu/project-workspace
  - chown -R ubuntu:ubuntu /home/ubuntu/project-workspace
  
  # 2. DYNAMIC PHP VERSION DETECTION AND EXTENSION INSTALLATION
  - |
    # Read the parameter from Makefile (e.g., php82 or php83)
    RAW_VER="%%php_version%%"
    # If left empty or template not rendered, do not install
    if [ -n "$RAW_VER" ] && [ "$RAW_VER" != "" ] && [ "$RAW_VER" != "%""%php_version%""%" ]; then
      # Clean and convert version format (php82 -> 8.2)
      PHP_DOT_VER=$(echo "$RAW_VER" | sed 's/php//' | sed 's/\([0-9]\)\([0-9]\)/\1.\2/')
      echo "Installing Selected Dynamic PHP Version: $PHP_DOT_VER"
      
      # Add current PHP Repo (PPA) to Ubuntu
      add-apt-repository -y ppa:ondrej/php
      apt-get update -y
      
      # PHP extension names defined in a plain array
      MODULES=(
        "cli"
        "fpm"
        "common"
        "bcmath"
        "intl"
        "zip"
        "mbstring"
        "xml"
        "curl"
        "opcache"
        "redis"
        "sqlite3"
        "pgsql"
        "mysql"
      )

      # Dynamically convert plain module names to full package names with phpX.X- prefix
      PHP_EXTENSIONS=()
      for mod in "${MODULES[@]}"; do
        PHP_EXTENSIONS+=("php${PHP_DOT_VER}-${mod}")
      done
      
      # Execute installation with dynamically generated full package list
      apt-get install -y "${PHP_EXTENSIONS[@]}"

      # 3. Composer Installation (only if PHP is active)
      curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    else
      echo "PHP Version is empty or disabled. Skipping PHP and Composer installation."
    fi

  # 3.5 DYNAMIC NODEJS VERSION INSTALLATION
  - |
    NODE_RAW_VER="%%node_version%%"
    if [ -n "$NODE_RAW_VER" ] && [ "$NODE_RAW_VER" != "" ] && [ "$NODE_RAW_VER" != "%""%node_version%""%" ]; then
      # Clean and convert version format (nodejs_18 -> 18)
      NODE_DOT_VER=$(echo "$NODE_RAW_VER" | sed 's/nodejs_//')
      echo "Installing Selected Dynamic Node.js Version: v$NODE_DOT_VER"
      
      # Add NodeSource repo and install
      curl -fsSL https://deb.nodesource.com/setup_${NODE_DOT_VER}.x | bash -
      apt-get install -y nodejs
    else
      echo "Node Version is empty or disabled. Skipping Node.js installation."
    fi

  # 4. DYNAMIC DATABASE INSTALLATION & NETWORK CONFIGURATION
  - |
    DATABASES="%%enabled_databases%%"
    if [ -n "$DATABASES" ] && [ "$DATABASES" != "" ] && [ "$DATABASES" != "%""%enabled_databases%""%" ]; then
      echo "Installing Databases: $DATABASES"
      for db in $DATABASES; do
        if [ "$db" = "redis" ]; then
          echo "Setting up Redis..."
          apt-get install -y redis-server
          sed -i 's/bind 127.0.0.1 ::1/bind 0.0.0.0/g' /etc/redis/redis.conf
          systemctl restart redis-server
        elif [ "$db" = "postgres" ]; then
          echo "Setting up PostgreSQL..."
          apt-get install -y postgresql postgresql-contrib
          # Allow external connections
          CONF_FILE=$(ls /etc/postgresql/*/main/postgresql.conf | head -n 1)
          HBA_FILE=$(ls /etc/postgresql/*/main/pg_hba.conf | head -n 1)
          if [ -n "$CONF_FILE" ]; then echo "listen_addresses = '*'" >> "$CONF_FILE"; fi
          if [ -n "$HBA_FILE" ]; then echo "host all all 0.0.0.0/0 md5" >> "$HBA_FILE"; fi
          systemctl restart postgresql
        elif [ "$db" = "mariadb" ]; then
          echo "Setting up MariaDB..."
          apt-get install -y mariadb-server
        elif [ "$db" = "sqlite" ]; then
          echo "Setting up SQLite..."
          apt-get install -y sqlite3
        fi
      done
    else
      echo "No databases specified. Skipping database installation."
    fi

final_message: "--> [SUCCESS] VM Infrastructure, Dynamic PHP Version, Extensions, and Network Permissions Fully Configured."