#cloud-config
# Multipass VM ilk açılışta yapılacaklar (Cloud-init)
users:
  - default
  - name: developer
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

package_update: true
packages:
  - build-essential
  - git
  - curl
  - htop
  - python3
  - python3-pip

runcmd:
  - echo "Geliştirme dizinleri oluşturuluyor..."
  - mkdir -p /home/ubuntu/project-workspace
  - chown -R ubuntu:ubuntu /home/ubuntu/project-workspace

final_message: "Sanal makine kurulumu tamamlandı. SSH bağlantısı için hazır."
