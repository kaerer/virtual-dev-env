#cloud-config
# Multipass VM initial setup tasks (Cloud-init)
users:
  - default
  - name: developer
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash

package_update: true
packages:
  - build-essential
  - git
  - curl
  - htop
  - python3
  - python3-pip

runcmd:
  - echo "Creating development directories..."
  - mkdir -p /home/ubuntu/project-workspace
  - chown -R ubuntu:ubuntu /home/ubuntu/project-workspace

final_message: "Virtual machine setup completed. Ready for SSH connection."
